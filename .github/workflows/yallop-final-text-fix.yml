name: Finalize Yallop legend wording
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yallop-final-text-fix.yml'
permissions:
  contents: write
jobs:
  fix-wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix final legend wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s2=s.replace('F أحمر/بلا تلوين','F أحمر/مستحيل')
          if s2 == s:
              print('No wording change needed')
          else:
              p.write_text(s2, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Yallop legend wording"
            git push
          fi