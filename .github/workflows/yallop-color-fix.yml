name: Fix Yallop visibility colors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yallop-color-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-yallop-colors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply official Yallop color mapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          original = s

          # Official visual mapping used by the Yallop/ICOP visibility chart:
          # A green, B yellow, C magenta, D blue, E no colour, F impossible/red.
          palette = {
              '#108a00': '#2f9e44',   # A green
              '#63ff32': '#f6d84a',   # B yellow
              '#fff8b8': '#d64fd2',   # C magenta
              '#ffff00': '#3b63e6',   # D blue
              '#ff9900': '#ffffff',   # E no-colour representation in legends
              '#ff0000': '#e53935',   # impossible/red
          }
          for old, new in palette.items():
              s = s.replace(old, new)

          # Map renderer: E must remain unpainted; F and IMP are red/impossible.
          s = re.sub(
              r"function colorFor\(zone\)\{\s*return \{[^}]+\}\[zone\] \|\| 'rgba\(255,255,255,0\)';\s*\}",
              "function colorFor(zone){\n  return {A:'#2f9e44', B:'#f6d84a', C:'#d64fd2', D:'#3b63e6', E:'rgba(255,255,255,0)', F:'#e53935', IMP:'#e53935'}[zone] || 'rgba(255,255,255,0)';\n}",
              s,
          )

          # Audit/report badges must mirror the same six Yallop classes.
          s = re.sub(r"\.bA\{[^}]*\}", ".bA{background:#2f9e44;color:#fff}", s)
          s = re.sub(r"\.bB\{[^}]*\}", ".bB{background:#f6d84a;color:#111}", s)
          s = re.sub(r"\.bC\{[^}]*\}", ".bC{background:#d64fd2;color:#fff}", s)
          s = re.sub(r"\.bD\{[^}]*\}", ".bD{background:#3b63e6;color:#fff}", s)
          s = re.sub(r"\.bE\{[^}]*\}", ".bE{background:#fff;color:#111;border:1px solid #789}", s)
          s = re.sub(r"\.bF\{[^}]*\}", ".bF{background:#e53935;color:#fff}", s)
          s = re.sub(r"\.bIMP\{[^}]*\}", ".bIMP{background:#e53935;color:#fff}", s)

          # Correct Arabic colour names and descriptions everywhere in UI/reports.
          text_replacements = {
              'A أخضر داكن': 'A أخضر',
              'B أخضر فاتح': 'B أصفر',
              'C أصفر باهت': 'C أرجواني',
              'D أصفر': 'D أزرق',
              'E برتقالي': 'E بلا لون',
              'F أبيض': 'F أحمر',
              "أخضر داكن: A — مرئي بسهولة بالعين المجردة": "أخضر: A — مرئي بسهولة بالعين المجردة",
              "أخضر فاتح: B — مرئي بالعين المجردة في ظروف مثالية": "أصفر: B — مرئي بالعين المجردة في ظروف مثالية",
              "أصفر باهت: C — قد يحتاج وسيلة بصرية لتحديد الهلال أولًا": "أرجواني: C — قد يحتاج وسيلة بصرية لتحديد الهلال أولًا",
              "أصفر: D — يحتاج وسيلة بصرية لإيجاد الهلال": "أزرق: D — يحتاج وسيلة بصرية لإيجاد الهلال",
              "برتقالي: E — غير مرئي بتلسكوب تقليدي": "بلا لون: E — غير ممكن وفق فئة يالوب E",
              "أبيض: F — غير مرئي وتحت حد دانجون": "أحمر: F — مستحيل/تحت حد دانجون",
              "A:'أخضر داكن'": "A:'أخضر'",
              "B:'أخضر فاتح'": "B:'أصفر'",
              "C:'أصفر باهت'": "C:'أرجواني'",
              "D:'أصفر'": "D:'أزرق'",
              "E:'برتقالي'": "E:'بلا لون'",
              "F:'أبيض'": "F:'أحمر'",
              'A أخضر داكن، B أخضر فاتح، C أصفر باهت، D أصفر، E برتقالي، F أبيض/بلا تلوين': 'A أخضر، B أصفر، C أرجواني، D أزرق، E بلا لون، F أحمر/مستحيل',
              'F/غير ملوّن': 'E/غير ملوّن',
          }
          for old, new in text_replacements.items():
              s = s.replace(old, new)

          # Normalize legend swatches after textual replacement, including generated report legend.
          def swatch(label, colour, border=''):
              nonlocal_dummy = None
              return colour

          # Replace any remaining old inline colour representations tied to Yallop classes.
          patterns = [
              (r'(style="background:)[^"]+("[^>]*></span>A أخضر)', r'\g<1>#2f9e44\g<2>'),
              (r'(style="background:)[^"]+("[^>]*></span>B أصفر)', r'\g<1>#f6d84a\g<2>'),
              (r'(style="background:)[^"]+("[^>]*></span>C أرجواني)', r'\g<1>#d64fd2\g<2>'),
              (r'(style="background:)[^"]+("[^>]*></span>D أزرق)', r'\g<1>#3b63e6\g<2>'),
              (r'(style="background:)[^"]+("[^>]*></span>E بلا لون)', r'\g<1>#ffffff;border:1px solid #789\g<2>'),
              (r'(style="background:)[^"]+("[^>]*></span>F أحمر)', r'\g<1>#e53935\g<2>'),
          ]
          for pat, repl in patterns:
              s = re.sub(pat, repl, s)

          # Guardrails: numerical Yallop q thresholds are intentionally untouched.
          if 'function colorFor(zone)' not in s:
              raise SystemExit('colorFor function not found after patch')
          expected = ["A:'#2f9e44'", "B:'#f6d84a'", "C:'#d64fd2'", "D:'#3b63e6'", "E:'rgba(255,255,255,0)'", "F:'#e53935'", "IMP:'#e53935'"]
          missing = [x for x in expected if x not in s]
          if missing:
              raise SystemExit('Missing expected Yallop mappings: ' + ', '.join(missing))
          if s == original:
              raise SystemExit('No changes applied')

          path.write_text(s, encoding='utf-8')
          print('Yallop color mapping patched successfully.')
          PY

      - name: Commit corrected map colors
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes to commit."
          else
            git commit -m "Correct Yallop visibility map colors"
            git push
          fi